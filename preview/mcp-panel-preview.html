<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-mcp-manager · 面板静态预览</title>
    <style>
      :root {
        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #f7f7f8;
        --dsw-alias-bg-layer-3: #f0f1f3;
        --dsw-alias-border-l1: #e4e5e9;
        --dsw-alias-border-l2: #d3d5db;
        --dsw-alias-label-primary: #1b1c1f;
        --dsw-alias-label-secondary: #5b5e66;
        --dsw-alias-label-tertiary: #8a8d96;
        --dsw-alias-brand-primary: #4d6bfe;
        --dsw-alias-bg-brand: #4d6bfe;
        --dsw-alias-label-on-brand: #ffffff;
        --dsw-alias-bg-success: #e8f5ec;
        --dsw-alias-label-success: #1f7a3d;
        --dsw-alias-bg-warning: #fdf3e3;
        --dsw-alias-label-warning: #8a5a00;
        --dsw-alias-bg-danger: #fdecec;
        --dsw-alias-label-danger: #a11212;
        --dsw-alias-bg-info: #eaf0ff;
        --dsw-alias-label-info: #2b4ac0;
        --dsw-font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color-scheme: light;
      }
      body[data-ds-dark-theme] {
        --dsw-alias-bg-base: #17181b;
        --dsw-alias-bg-layer-1: #1e2024;
        --dsw-alias-bg-layer-2: #24262b;
        --dsw-alias-bg-layer-3: #2b2e34;
        --dsw-alias-border-l1: #33363d;
        --dsw-alias-border-l2: #43474f;
        --dsw-alias-label-primary: #f2f3f5;
        --dsw-alias-label-secondary: #b9bdc6;
        --dsw-alias-label-tertiary: #8b909a;
        --dsw-alias-brand-primary: #7b93ff;
        --dsw-alias-bg-brand: #4d6bfe;
        --dsw-alias-label-on-brand: #ffffff;
        --dsw-alias-bg-success: #1d3526;
        --dsw-alias-label-success: #7fd79b;
        --dsw-alias-bg-warning: #3a2f1a;
        --dsw-alias-label-warning: #f0c067;
        --dsw-alias-bg-danger: #3b1f1f;
        --dsw-alias-label-danger: #f0a0a0;
        --dsw-alias-bg-info: #1f2a4a;
        --dsw-alias-label-info: #9db4ff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); font-family: var(--dsw-font-family-base); }
      .preview-shell { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }
      .preview-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 16px; border: 1px solid var(--dsw-alias-border-l1); border-radius: 10px; background: var(--dsw-alias-bg-layer-2); font-size: 13px; }
      .preview-bar span { color: var(--dsw-alias-label-secondary); }
      .preview-bar button { padding: 5px 12px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; background: var(--dsw-alias-bg-layer-1); color: inherit; cursor: pointer; }
      .preview-panel { padding: 20px; border: 1px solid var(--dsw-alias-border-l1); border-radius: 14px; background: var(--dsw-alias-bg-layer-1); }
    </style>
    
  </head>

.dsh-mcp {
  display: flex;
  flex-direction: column;
  gap: 16px;
  color: ${$.text};
  font-size: 13px;
  line-height: 1.55;
}
.dsh-mcp * { box-sizing: border-box; }
.dsh-mcp-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.dsh-mcp-hero h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; line-height: 1.3; }
.dsh-mcp-hero p { margin: 0; color: ${$.secondary}; max-width: 62ch; }
.dsh-mcp-hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dsh-mcp-banner {
  display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: ${Vl};
  border: 1px solid ${$.border}; background: ${$.surfaceRaised}; color: ${$.secondary};
}
.dsh-mcp-banner[data-tone="error"] { border-color: ${$.danger}; background: ${$.dangerSoft}; color: ${$.danger}; }
.dsh-mcp-banner[data-tone="warning"] { border-color: ${$.warn}; background: ${$.warnSoft}; color: ${$.warn}; }
.dsh-mcp-banner[data-tone="success"] { border-color: ${$.success}; background: ${$.successSoft}; color: ${$.success}; }
.dsh-mcp-banner-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dsh-mcp-banner-close { flex: none; }
.dsh-mcp-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.dsh-mcp-search { flex: 1 1 240px; min-width: 180px; }
.dsh-mcp-search input { width: 100%; }
.dsh-mcp-project { display: inline-flex; align-items: center; gap: 6px; color: ${$.secondary}; }
.dsh-mcp-project select {
  max-width: 280px; padding: 5px 8px; border-radius: ${Nr}; border: 1px solid ${$.border};
  background: ${$.surface}; color: ${$.text}; font: inherit;
}
.dsh-mcp-project select:focus-visible { outline: none; box-shadow: ${lc}; }
.dsh-mcp-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: ${$.secondary}; }
.dsh-mcp-summary-chip { display: inline-flex; align-items: center; gap: 6px; }
.dsh-mcp-summary-total { margin-left: auto; color: ${$.tertiary}; }
.dsh-mcp-list { display: flex; flex-direction: column; gap: 10px; }
.dsh-mcp-card {
  display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid ${$.border};
  border-radius: ${Vl}; background: ${$.surface};
}
.dsh-mcp-card[data-disabled="true"] { background: ${$.surfaceSubtle}; }
.dsh-mcp-card-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.dsh-mcp-name { font-family: ${_r}; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.dsh-mcp-head-tags { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dsh-mcp-head-end { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.dsh-mcp-status { display: inline-flex; align-items: center; gap: 6px; color: ${$.secondary}; white-space: nowrap; }
.dsh-mcp-status[data-tone="error"] { color: ${$.danger}; }
.dsh-mcp-status[data-tone="warning"] { color: ${$.warn}; }
.dsh-mcp-status[data-tone="done"] { color: ${$.success}; }
.dsh-mcp-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; color: ${$.secondary}; }
.dsh-mcp-meta code, .dsh-mcp-code {
  font-family: ${_r}; font-size: 12px; color: ${$.text}; background: ${$.surfaceRaised};
  padding: 1px 6px; border-radius: ${Nr}; overflow-wrap: anywhere;
}
.dsh-mcp-detail { color: ${$.secondary}; overflow-wrap: anywhere; }
.dsh-mcp-detail strong { color: ${$.danger}; font-weight: 500; }
.dsh-mcp-inline-note { display: flex; align-items: flex-start; gap: 6px; color: ${$.warn}; }
.dsh-mcp-inline-note[data-tone="error"] { color: ${$.danger}; }
.dsh-mcp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dsh-mcp-actions-end { margin-left: auto; display: inline-flex; gap: 6px; }
.dsh-mcp-tools { border-top: 1px dashed ${$.border}; padding-top: 8px; }
.dsh-mcp-tools summary {
  display: flex; align-items: center; gap: 6px; cursor: pointer; color: ${$.secondary}; list-style: none;
}
.dsh-mcp-tools summary::-webkit-details-marker { display: none; }
.dsh-mcp-tools summary::before {
  content: ''; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; transition: transform 120ms ease;
}
.dsh-mcp-tools[open] summary::before { transform: rotate(90deg); }
.dsh-mcp-tools-body { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.dsh-mcp-tools-search input { width: 100%; max-width: 320px; }
.dsh-mcp-tool-list { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; }
.dsh-mcp-tool {
  display: flex; align-items: flex-start; gap: 12px; padding: 6px 8px; border-radius: ${Nr};
}
.dsh-mcp-tool:hover { background: ${$.surfaceSubtle}; }
.dsh-mcp-tool-main { flex: 1; min-width: 0; }
.dsh-mcp-tool-name { font-family: ${_r}; font-size: 12px; overflow-wrap: anywhere; }
.dsh-mcp-tool-desc { color: ${$.tertiary}; font-size: 12px; overflow-wrap: anywhere; }
.dsh-mcp-tool-toggle { flex: none; }
.dsh-mcp-empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 16px; text-align: center;
  border: 1px dashed ${$.border}; border-radius: ${Vl}; color: ${$.secondary};
}
.dsh-mcp-empty strong { color: ${$.text}; font-size: 14px; }
.dsh-mcp-sources { border: 1px solid ${$.border}; border-radius: ${Vl}; background: ${$.surfaceSubtle}; }
.dsh-mcp-sources summary { cursor: pointer; padding: 10px 14px; color: ${$.secondary}; }
.dsh-mcp-sources-body { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
.dsh-mcp-source-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dsh-mcp-source-row code { font-family: ${_r}; font-size: 11px; overflow-wrap: anywhere; }
.dsh-mcp-note { color: ${$.tertiary}; font-size: 12px; margin: 0; }
.dsh-mcp-editor { display: flex; flex-direction: column; gap: 14px; }
.dsh-mcp-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dsh-mcp-field > label, .dsh-mcp-field-label { color: ${$.secondary}; font-size: 12px; }
.dsh-mcp-field input, .dsh-mcp-field select, .dsh-mcp-field textarea {
  width: 100%; padding: 6px 9px; border-radius: ${Nr}; border: 1px solid ${$.border};
  background: ${$.surface}; color: ${$.text}; font: inherit;
}
.dsh-mcp-field input[aria-invalid="true"] { border-color: ${$.danger}; }
.dsh-mcp-field input:focus-visible, .dsh-mcp-field select:focus-visible {
  outline: none; border-color: ${$.business}; box-shadow: ${lc};
}
.dsh-mcp-field-hint { color: ${$.tertiary}; font-size: 11px; overflow-wrap: anywhere; }
.dsh-mcp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.dsh-mcp-section-title { font-weight: 600; color: ${$.text}; margin: 0; }
.dsh-mcp-rows { display: flex; flex-direction: column; gap: 6px; }
.dsh-mcp-row { display: flex; align-items: center; gap: 6px; }
.dsh-mcp-row input { flex: 1; min-width: 0; }
.dsh-mcp-row-key { flex: 0 1 34%; }
.dsh-mcp-row-flag { display: inline-flex; align-items: center; gap: 4px; color: ${$.secondary}; font-size: 12px; white-space: nowrap; }
.dsh-mcp-row-remove { flex: none; }
.dsh-mcp-tag-note { color: ${$.tertiary}; font-size: 11px; }
.dsh-mcp-footer { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dsh-mcp-probe { display: flex; flex-direction: column; gap: 10px; }
.dsh-mcp-probe-list { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow: auto; }
.dsh-mcp-probe-item { font-family: ${_r}; font-size: 12px; padding: 3px 6px; border-radius: ${Nr}; background: ${$.surfaceSubtle}; }
.dsh-mcp-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; }
.dsh-mcp-kv dt { color: ${$.secondary}; }
.dsh-mcp-kv dd { margin: 0; overflow-wrap: anywhere; }
.dsh-mcp-oauth-link {
  display: inline-flex; align-items: center; gap: 6px; color: ${$.business}; overflow-wrap: anywhere;
}
.dsh-mcp-loading { display: flex; align-items: center; gap: 8px; padding: 24px 0; color: ${$.secondary}; }
.dsh-mcp-visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (max-width: 767px) {
  .dsh-mcp-hero { flex-direction: column; }
  .dsh-mcp-hero-actions { width: 100%; }
  .dsh-mcp-card { padding: 12px; }
  .dsh-mcp-head-end { margin-left: 0; width: 100%; }
  .dsh-mcp-summary-total { margin-left: 0; }
  .dsh-mcp-source-row { flex-direction: column; gap: 2px; }
}
