name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # dsh disables any profile plugin whose @deepseek-ai/dsh* peer range the
      # running runtime rejects. The floor comes from engines.dsh in package.json,
      # so this step cannot drift from the manifest again; the no-argument run
      # checks the runtime the dev dependencies install.
      - name: Check dsh compatibility
        run: |
          floor=$(node -e "process.stdout.write(require('./package.json').engines.dsh.split(' ')[0].replace(/^[^0-9]+/, ''))")
          echo "engines.dsh floor: $floor"
          pnpm check:compat "$floor"
          pnpm check:compat

      - name: Build
        run: pnpm build

      # 若此步失败，需在本地执行 `pnpm build` 后提交 lib/ 变更，
      # 确保重建产物与已提交产物零差异，防止源码与 lib/ 漂移。
      # （*.tsbuildinfo 已被 .gitignore 忽略，不影响 diff）
      - name: Check lib/ artifacts
        run: git diff --exit-code -- lib/
